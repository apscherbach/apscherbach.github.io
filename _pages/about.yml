# Adriano P. Scherbach

Olá! Sou um profissional de TI com foco em infraestrutura, atuando em áreas como Linux, Kubernetes, monitoramento (Prometheus, Grafana, ELK) e virtualização (KVM, VMware, Docker). Minha experiência inclui automação de ambientes complexos, resolução de desafios de escala e otimização de performance.

Atualmente, desenvolvo projetos demonstrativos para mostrar minhas habilidades, como setups de clusters Kubernetes e scripts de automação Linux, sem detalhes de trabalhos corporativos.

